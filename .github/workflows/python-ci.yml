name: Python CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Python quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.9'
      - name: Compile Python and validate manifests
        run: |
          python -m compileall -q plugin tests
          python - <<'PY'
          import json
          from pathlib import Path

          manifests = {}
          for root in (Path('.agents'), Path('plugin'), Path('tests')):
              for manifest in sorted(root.rglob('*.json')):
                  print(manifest, flush=True)
                  with manifest.open(encoding='utf-8') as manifest_file:
                      manifests[manifest] = json.load(manifest_file)

          desktop_version = manifests[Path('plugin/.codex-plugin/plugin.json')]['version']
          plugin_version = manifests[Path('plugin/plugin.json')]['version']
          if desktop_version != plugin_version:
              raise SystemExit(f'Plugin manifest versions differ: {desktop_version} and {plugin_version}')
          PY
      - name: Test the research card widget
        run: node tests/research_card.mjs

  integration:
    name: Python integration (macOS ARM64, ${{ matrix.python }})
    runs-on: macos-15
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.15']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install the pinned NAOME Protocol release
        shell: bash
        run: |
          release=tests/naome-release.json
          protocol_version=$(jq -er '.protocol_version | strings | select(length > 0)' "$release")
          sha256=$(jq -er '.macos_arm64_sha256 | strings | select(test("^[0-9a-f]{64}$"))' "$release")
          asset="nao-v${protocol_version}-aarch64-apple-darwin.tar.gz"
          directory=$(mktemp -d "$RUNNER_TEMP/nao.XXXXXX")
          curl --fail --location --silent --show-error --retry 3 \
            --output "$directory/$asset" \
            "https://github.com/naome-core/naome-protocol/releases/download/v${protocol_version}/$asset"
          printf '%s  %s\n' "$sha256" "$directory/$asset" | shasum -a 256 -c
          tar -xzf "$directory/$asset" -C "$directory" ./nao
          printf 'NAO_TEST_BINARY=%s\n' "$directory/nao" >> "$GITHUB_ENV"
      - name: Run integration tests
        run: |
          python tests/integration.py
          python tests/archive_search.py
          python tests/turn_routing.py
          python tests/project_setup.py
          python tests/legacy_archives.py
