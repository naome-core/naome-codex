<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Naome research records</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; }
  __NAOME_CARD_STYLES__
</style>
</head>
<body>
<section id="results" aria-label="Naome research records" hidden>
  <div id="records" class="naome-record-list"></div>
  <p id="notice" class="naome-search-notice" hidden></p>
</section>
<template id="record-template">
  <article class="naome-card">
    <header class="naome-card-header">
      <img class="naome-card-logo" src="__NAOME_CARD_LOGO__" alt="" width="18" height="18">
      <div>
        <h2></h2>
        <p class="naome-card-context"></p>
      </div>
    </header>
    <div class="naome-card-body">
      <dl class="naome-card-fields" hidden></dl>
      <p class="naome-card-summary">
        <span class="naome-card-preview" hidden></span>
        <button class="naome-card-toggle" type="button" aria-expanded="false">more</button>
      </p>
    </div>
  </article>
</template>
<script>
  (() => {
    const results = document.getElementById('results');
    const records = document.getElementById('records');
    const notice = document.getElementById('notice');
    const template = document.getElementById('record-template');
    const translations = {
      en: {
        title: 'Naome research records', details: 'Research record details', record: 'Research record',
        show: 'more', hide: 'less', limited: 'Search coverage is limited.',
        fields: { summary: 'Summary', excerpt: 'Search excerpt', sources: 'Sources', links: 'Linked records',
          recordId: 'Record ID', lab: 'Lab', snapshot: 'Search snapshot', location: 'Match location' },
        categories: { question: 'Question', hypothesis: 'Hypothesis', method: 'Method',
          observation: 'Observation', result: 'Result', limitation: 'Limitation', correction: 'Correction',
          claim: 'Claim', plan: 'Plan', occurrence: 'Occurrence', derivation: 'Derivation' }
      },
      de: {
        title: 'Naome-Forschungseinträge', details: 'Details zum Forschungseintrag', record: 'Forschungseintrag',
        show: 'mehr', hide: 'weniger', limited: 'Die Suche deckt nur einen Teil der Daten ab.',
        fields: { summary: 'Zusammenfassung', excerpt: 'Suchauszug', sources: 'Quellen', links: 'Verknüpfte Einträge',
          recordId: 'Eintrags-ID', lab: 'Labor', snapshot: 'Such-Snapshot', location: 'Fundstelle' },
        categories: { question: 'Frage', hypothesis: 'Hypothese', method: 'Methode',
          observation: 'Beobachtung', result: 'Ergebnis', limitation: 'Einschränkung', correction: 'Korrektur',
          claim: 'Behauptung', plan: 'Plan', occurrence: 'Ereignis', derivation: 'Ableitung' }
      }
    };
    let labels = translations.en;
    const dateOptions = { dateStyle: 'medium', timeStyle: 'short' };
    let dateFormatter = new Intl.DateTimeFormat('en', dateOptions);
    let cards = [];
    let ready = false;
    let lastHeight;
    const send = (message) => window.parent.postMessage({ jsonrpc: '2.0', ...message }, '*');
    const reportSize = () => {
      const height = Math.ceil(results.getBoundingClientRect().height);
      if (!ready || height === lastHeight) return;
      lastHeight = height;
      send({ method: 'ui/notifications/size-changed', params: { height } });
    };

    const isId = (value) => typeof value === 'string' && /^1:[012]:[0-9a-f]{64}$/.test(value);
    const isTextList = (values) => Array.isArray(values) && values.every(value => typeof value === 'string');
    const excerptPreview = (value) => value.length <= 160 ? value : value.slice(0, 159).trimEnd() + '…';

    function recordEntries(result) {
      const data = result?.structuredContent;
      if (result?.isError || typeof data?.lab !== 'string') return [];
      if (data.source === 'codex_archive_receipts' && Array.isArray(data.records)) {
        const summaries = result?._meta?.['naome/research-summaries'];
        return data.records.filter(record => isId(record?.record_id) && typeof record.title === 'string')
          .map(record => ({ recordId: record.record_id, title: record.title, category: record.category,
            project: data.project, lab: data.lab, capturedAt: record.captured_at,
            preview: typeof record.preview === 'string' ? record.preview : '',
            fields: { summary: summaries?.[record.record_id] ?? record.preview } }));
      }
      if (isId(data.head) && Array.isArray(data.hits)) {
        return data.hits.filter(hit => isId(hit?.record_id)).map(hit => {
          const excerpt = typeof hit.snippet === 'string' ? hit.snippet : '';
          const links = Array.isArray(hit.links) ? hit.links.map(link => link?.target).filter(isId) : [];
          return { recordId: hit.record_id, title: hit.subject, category: hit.kind, project: data.project, lab: data.lab,
            preview: excerptPreview(excerpt), fields: { excerpt, links, snapshot: data.head,
              location: hit.location?.pointer } };
        });
      }
      const full = result?._meta?.['naome/research-block'];
      if (!isId(data.record_id) || full?.record_id !== data.record_id ||
          ![data.title, data.category, data.summary, full.summary].every(value => typeof value === 'string') ||
          !isTextList(full.sources) || !isTextList(full.linked_records)) return [];
      return [{ recordId: data.record_id, title: data.title, category: data.category, project: data.project, lab: data.lab,
        preview: data.summary, fields: { summary: full.summary, sources: full.sources, links: full.linked_records } }];
    }

    function field(name, value) {
      const isList = isTextList(value) && value.length > 0;
      if (!isList && (typeof value !== 'string' || !value)) return null;
      const row = document.createElement('div');
      const label = document.createElement('dt');
      label.textContent = labels.fields[name];
      const content = document.createElement('dd');
      if (isList) {
        const list = document.createElement('ul');
        list.append(...value.map(text => {
          const item = document.createElement('li');
          item.textContent = text;
          return item;
        }));
        content.append(list);
      } else if (name === 'recordId' || name === 'snapshot') {
        const code = document.createElement('code');
        code.textContent = value;
        content.append(code);
      } else {
        content.textContent = value;
      }
      row.append(label, content);
      return row;
    }

    function updateCard({ entry, heading, context, toggle, details }) {
      heading.textContent = typeof entry.title === 'string' && entry.title ? entry.title : labels.record;
      const category = typeof entry.category === 'string' && Object.hasOwn(labels.categories, entry.category)
        ? labels.categories[entry.category] : '';
      const date = typeof entry.capturedAt === 'string' ? new Date(entry.capturedAt) : null;
      const timestamp = date && Number.isFinite(date.getTime()) ? dateFormatter.format(date) : '';
      const defaultLab = entry.lab === 'default';
      const project = typeof entry.project === 'string' ? entry.project : '';
      context.textContent = [category, project, defaultLab ? '' : 'Lab ' + entry.lab, timestamp]
        .filter(Boolean).join(' · ');
      details.setAttribute('aria-label', labels.details);
      toggle.textContent = details.hidden ? labels.show : labels.hide;
      if (!details.hidden) {
        const fields = { ...entry.fields, lab: defaultLab ? entry.lab : null, recordId: entry.recordId };
        details.replaceChildren(...Object.entries(fields).map(([name, value]) => field(name, value)).filter(Boolean));
      }
    }

    function makeCard(entry, index) {
      const element = template.content.firstElementChild.cloneNode(true);
      const heading = element.querySelector('h2');
      const context = element.querySelector('.naome-card-context');
      const toggle = element.querySelector('button');
      const details = element.querySelector('dl');
      const preview = element.querySelector('.naome-card-preview');
      heading.id = 'record-heading-' + index;
      details.id = 'record-details-' + index;
      element.setAttribute('aria-labelledby', heading.id);
      toggle.setAttribute('aria-controls', details.id);
      preview.textContent = entry.preview ?? '';
      preview.hidden = !entry.preview;
      const card = { entry, element, heading, context, toggle, details };
      toggle.addEventListener('click', () => {
        details.hidden = !details.hidden;
        preview.hidden = !entry.preview || !details.hidden;
        toggle.setAttribute('aria-expanded', String(!details.hidden));
        if (details.hidden) details.replaceChildren();
        updateCard(card);
        reportSize();
      });
      updateCard(card);
      return card;
    }

    const hostStyles = {
      '--color-text-primary': 'color', '--color-text-secondary': 'color',
      '--color-border-secondary': 'color', '--font-sans': 'font-family', '--border-radius-lg': 'border-radius'
    };

    function applyHostContext({ locale: hostLocale, theme, styles } = {}) {
      if (typeof hostLocale === 'string') {
        const language = /^de(?:-|$)/i.test(hostLocale) ? 'de' : 'en';
        try {
          dateFormatter = new Intl.DateTimeFormat(hostLocale, dateOptions);
        } catch {
          dateFormatter = new Intl.DateTimeFormat(language, dateOptions);
        }
        labels = translations[language];
        document.documentElement.lang = language;
        document.title = labels.title;
        results.setAttribute('aria-label', labels.title);
        notice.textContent = labels.limited;
        cards.forEach(updateCard);
      }
      if (theme === 'light' || theme === 'dark') document.documentElement.style.colorScheme = theme;
      if (styles !== undefined) {
        const style = document.documentElement.style;
        for (const [name, property] of Object.entries(hostStyles)) {
          const value = styles?.variables?.[name];
          if (typeof value === 'string' && CSS.supports(property, value)) style.setProperty(name, value);
          else style.removeProperty(name);
        }
      }
    }

    function showResult(result) {
      cards = recordEntries(result).map(makeCard);
      records.replaceChildren(...cards.map(card => card.element));
      const data = result?.structuredContent;
      notice.textContent = labels.limited;
      notice.hidden = !Array.isArray(data?.hits) ||
        ![data.limited_coverage, data.vector_budget_exhausted, data.query_limited].includes(true);
      results.hidden = cards.length === 0;
      reportSize();
    }

    window.addEventListener('message', ({ source, data }) => {
      if (source !== window.parent || data?.jsonrpc !== '2.0') return;
      if (!ready && data.id === 1 && data.result) {
        applyHostContext(data.result.hostContext ?? {});
        ready = true;
        send({ method: 'ui/notifications/initialized' });
        reportSize();
        return;
      }
      if (!ready) return;
      if (data.method === 'ui/notifications/host-context-changed') {
        applyHostContext(data.params ?? {});
        reportSize();
      } else if (data.method === 'ui/notifications/tool-result') {
        showResult(data.params);
      } else if (data.method === 'ui/resource-teardown' && data.id !== undefined) {
        ready = false;
        showResult();
        send({ id: data.id, result: {} });
      }
    });
    new ResizeObserver(reportSize).observe(results);
    send({ id: 1, method: 'ui/initialize', params: {
      appInfo: { name: 'Naome research records', version: '0.1.0' },
      appCapabilities: { availableDisplayModes: ['inline'] },
      protocolVersion: '2026-01-26'
    } });
  })();
</script>
</body>
</html>
